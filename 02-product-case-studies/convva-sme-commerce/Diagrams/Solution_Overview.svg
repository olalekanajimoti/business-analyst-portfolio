ation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="white">2. Services</text><rect x="440.0" y="160.0" width="230" height="84" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="555.0" y="198.1" text-anchor="middle" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#1E293B">Catalogue and inventory</text><text x="555.0" y="216.1" text-anchor="middle" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#1E293B">service</text><rect x="440.0" y="290.0" width="230" height="84" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="555.0" y="337.1" text-anchor="middle" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#1E293B">Order service</text><rect x="810" y="100" width="270" height="294" rx="12" fill="#F7F9FC" stroke="#D5DDE8" stroke-width="1.5"/><rect x="810" y="100" width="270" height="40" rx="12" fill="#15253D"/><rect x="810" y="120" width="270" height="20" fill="#15253D"/><text x="945.0" y="125.2" text-anchor="middle" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="white">3. Records</text><rect x="830.0" y="160.0" width="230" height="84" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="945.0" y="207.1" text-anchor="middle" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#1E293B">Product and stock record</text><rect x="830.0" y="290.0" width="230" height="84" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="945.0" y="337.1" text-anchor="middle" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#1E293B">Order timeline</text><rect x="1200" y="100" width="270" height="294" rx="12" fill="#F7F9FC" stroke="#D5DDE8" stroke-width="1.5"/><rect x="1200" y="100" width="270" height="40"