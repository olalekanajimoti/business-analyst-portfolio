e="20" font-weight="700" fill="#15253D">Numbered flows</text><text x="40" y="809" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" fill="#1E293B">1. Buyer pays for tickets</text><text x="40" y="841" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" fill="#1E293B">2. Organiser invites team</text><text x="40" y="873" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" fill="#1E293B">3. Verified order issues tickets</text><text x="40" y="905" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" fill="#1E293B">4. Revenue posted per currency</text><text x="1000" y="809" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" fill="#1E293B">5. Scans logged against tickets</text><text x="1000" y="841" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" fill="#1E293B">6. Withdrawal requested for approval</text><text x="1000" y="873" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" fill="#1E293B">7. Consent and history for disputes</text></svg>