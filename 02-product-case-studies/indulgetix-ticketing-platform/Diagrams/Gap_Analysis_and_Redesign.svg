<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="340" viewBox="0 0 1410 340"><rect width="1410" height="100%" fill="white"/><text x="30" y="46" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#15253D">IndulgeTix: Gap analysis and redesign</text><text x="30" y="72" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" fill="#64748B">Each pain point traced to its root cause, the redesign response and how success is measured.</text><rect x="30" y="96" width="330" height="44" fill="#15253D" stroke="white" stroke-width="1"/><text x="46" y="124" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="white">Pain point</text><rect x="360" y="96" width="330" height="44" fill="#15253D" stroke="white" stroke-width="1"/><text x="376" y="124" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="white">Root cause</text><rect x="690" y="96" width="360" height="44" fill="#15253D" stroke="white" stroke-width="1"/><text x="706" y="124" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="white">Redesign response</text><rect x="1050" y="96" width="330" height="44" fill="#15253D" stroke="white" stroke-width="1"/><text x="1066" y="124" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="white">Evidence or measure</text><rect x="30" y="140" width="330" height="70" fill="#FFF4E8" stroke="#D5DDE8" stroke-width="1"/><text x="46" y="166" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1E293B">Ticket ownership could become</text><text x="46" y="186" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1E293B">ambiguous</text><rect x="360" y="140" width="330" height="70" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="376" y="166" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Separate guest lists and transfer messages</text><rect x="690" y="140" width="360" height="70" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="706" y="166" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Ticket state model with audit history</text><rect x="1050" y="140" width="330" height="70" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="1066" y="166" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Ownership conflicts per event</text><rect x="30" y="210" width="330" height="50" fill="#FFF4E8" stroke="#D5DDE8" stroke-width="1"/><text x="46" y="236" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1E293B">Entry could accept duplicates</text><rect x="360" y="210" width="330" height="50" fill="#F7F9FC" stroke="#D5DDE8" stroke-width="1"/><text x="376" y="236" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">No single scan state</text><rect x="690" y="210" width="360" height="50" fill="#F7F9FC" stroke="#D5DDE8" stroke-width="1"/><text x="706" y="236" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Real-time validation and exception view</text><rect x="1050" y="210" width="330" height="50" fill="#F7F9FC" stroke="#D5DDE8" stroke-width="1"/><text x="1066" y="236" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Duplicate-scan attempts and first-scan rate</text><rect x="30" y="260" width="330" height="50" fill="#FFF4E8" stroke="#D5DDE8" stroke-width="1"/><text x="46" y="286" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1E293B">Payout disputes</text><rect x="360" y="260" width="330" height="50" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="376" y="286" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Fees and refunds reconciled late</text><rect x="690" y="260" width="360" height="50" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="706" y="286" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Pre-payout settlement controls</text><rect x="1050" y="260" width="330" height="50" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="1066" y="286" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Variance by event before payout</text></svg>