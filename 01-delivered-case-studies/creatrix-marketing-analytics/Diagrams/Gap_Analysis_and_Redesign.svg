<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="340" viewBox="0 0 1410 340"><rect width="1410" height="100%" fill="white"/><text x="30" y="46" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#15253D">Creatrix Empire: Gap analysis and redesign</text><text x="30" y="72" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" fill="#64748B">Each pain point traced to its root cause, the redesign response and how success is measured.</text><rect x="30" y="96" width="330" height="44" fill="#15253D" stroke="white" stroke-width="1"/><text x="46" y="124" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="white">Pain point</text><rect x="360" y="96" width="330" height="44" fill="#15253D" stroke="white" stroke-width="1"/><text x="376" y="124" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="white">Root cause</text><rect x="690" y="96" width="360" height="44" fill="#15253D" stroke="white" stroke-width="1"/><text x="706" y="124" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="white">Redesign response</text><rect x="1050" y="96" width="330" height="44" fill="#15253D" stroke="white" stroke-width="1"/><text x="1066" y="124" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="white">Evidence or measure</text><rect x="30" y="140" width="330" height="70" fill="#FFF4E8" stroke="#D5DDE8" stroke-width="1"/><text x="46" y="166" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1E293B">Creative work started before outcome</text><text x="46" y="186" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1E293B">clarity</text><rect x="360" y="140" width="330" height="70" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="376" y="166" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Output-led briefs</text><rect x="690" y="140" width="360" height="70" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="706" y="166" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Approve objective and KPIs first</text><rect x="1050" y="140" width="330" height="70" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="1066" y="166" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Brief completeness at approval</text><rect x="30" y="210" width="330" height="50" fill="#FFF4E8" stroke="#D5DDE8" stroke-width="1"/><text x="46" y="236" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1E293B">Rework delayed launches</text><rect x="360" y="210" width="330" height="50" fill="#F7F9FC" stroke="#D5DDE8" stroke-width="1"/><text x="376" y="236" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Dependencies and approvals unclear</text><rect x="690" y="210" width="360" height="50" fill="#F7F9FC" stroke="#D5DDE8" stroke-width="1"/><text x="706" y="236" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Visible hand-offs and a brand-check gate</text><rect x="1050" y="210" width="330" height="50" fill="#F7F9FC" stroke="#D5DDE8" stroke-width="1"/><text x="1066" y="236" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Revision count and delay days</text><rect x="30" y="260" width="330" height="50" fill="#FFF4E8" stroke="#D5DDE8" stroke-width="1"/><text x="46" y="286" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1E293B">Optimisation relied on partial evidence</text><rect x="360" y="260" width="330" height="50" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="376" y="286" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Metrics stayed in channel silos</text><rect x="690" y="260" width="360" height="50" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="706" y="286" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Consolidated performance review</text><rect x="1050" y="260" width="330" height="50" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="1066" y="286" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Decisions linked to evidence</text></svg>