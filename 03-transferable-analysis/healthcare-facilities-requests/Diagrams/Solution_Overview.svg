<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="548" viewBox="0 0 1500 548"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,1 L10,6 L0,11 z" fill="#475569"/></marker></defs><rect width="1500" height="100%" fill="white"/><text x="30" y="46" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#15253D">Healthcare Facilities Requests: Solution overview</text><text x="30" y="72" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" fill="#64748B">Left to right: channels, processing, records and outputs. Numbers match the flow list below.</text><rect x="30" y="100" width="270" height="294" rx="12" fill="#F7F9FC" stroke="#D5DDE8" stroke-width="1.5"/><rect x="30" y="100" width="270" height="40" rx="12" fill="#15253D"/><rect x="30" y="120" width="270" height="20" fill="#15253D"/><text x="165.0" y="125.2" text-anchor="middle" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="white">1. Intake</text><rect x="50.0" y="225.0" width="230" height="84" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="165.0" y="263.1" text-anchor="middle" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#1E293B">Requesters on wards and</text><text x="165.0" y="281.1" text-anchor="middle" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="400" fill="#1E293B">offices</text><rect x="420" y="100" width="270" height="294" rx="12" fill="#F7F9FC" stroke="#D5DDE8" stroke-width="1.5"/><rect x="420" y="100" width="270" height="40" rx="12" fill="#15253D"/><rect x="420" y="120" width="270" height="20" fill="#15253D"/><text x="555.0" y="125.2" text-anchor="middle" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="white">2. Triage</text><re