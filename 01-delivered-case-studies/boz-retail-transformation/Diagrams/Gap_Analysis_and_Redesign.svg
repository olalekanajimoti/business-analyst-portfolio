<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="380" viewBox="0 0 1410 380"><rect width="1410" height="100%" fill="white"/><text x="30" y="46" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#15253D">BOZ Jewelry: Gap analysis and redesign</text><text x="30" y="72" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" fill="#64748B">Each pain point traced to its root cause, the redesign response and how success is measured.</text><rect x="30" y="96" width="330" height="44" fill="#15253D" stroke="white" stroke-width="1"/><text x="46" y="124" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="white">Pain point</text><rect x="360" y="96" width="330" height="44" fill="#15253D" stroke="white" stroke-width="1"/><text x="376" y="124" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="white">Root cause</text><rect x="690" y="96" width="360" height="44" fill="#15253D" stroke="white" stroke-width="1"/><text x="706" y="124" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="white">Redesign response</text><rect x="1050" y="96" width="330" height="44" fill="#15253D" stroke="white" stroke-width="1"/><text x="1066" y="124" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="white">Evidence or measure</text><rect x="30" y="140" width="330" height="70" fill="#FFF4E8" stroke="#D5DDE8" stroke-width="1"/><text x="46" y="166" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1E293B">Routine enquiries delayed sales</text><text x="46" y="186" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1E293B">conversations</text><rect x="360" y="140" width="330" height="70" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="376" y="166" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">One manual queue for every type of contact</text><rect x="690" y="140" width="360" height="70" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="706" y="166" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Classify the request and answer routine</text><text x="706" y="186" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">questions automatically</text><rect x="1050" y="140" width="330" height="70" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="1066" y="166" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Enquiry type mix and escalation reasons</text><rect x="30" y="210" width="330" height="70" fill="#FFF4E8" stroke="#D5DDE8" stroke-width="1"/><text x="46" y="236" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1E293B">Custom-order expectations were</text><text x="46" y="256" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1E293B">disputed</text><rect x="360" y="210" width="330" height="70" fill="#F7F9FC" stroke="#D5DDE8" stroke-width="1"/><text x="376" y="236" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">No single confirmed brief before production</text><rect x="690" y="210" width="360" height="70" fill="#F7F9FC" stroke="#D5DDE8" stroke-width="1"/><text x="706" y="236" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Structured specification with customer</text><text x="706" y="256" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">confirmation</text><rect x="1050" y="210" width="330" height="70" fill="#F7F9FC" stroke="#D5DDE8" stroke-width="1"/><text x="1066" y="236" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Remake rate and confirmation completeness</text><rect x="30" y="280" width="330" height="70" fill="#FFF4E8" stroke="#D5DDE8" stroke-width="1"/><text x="46" y="306" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1E293B">Leadership lacked delivery visibility</text><rect x="360" y="280" width="330" height="70" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="376" y="306" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Updates spread across chats, email and</text><text x="376" y="326" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">files</text><rect x="690" y="280" width="360" height="70" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="706" y="306" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">One owned delivery board with automated</text><text x="706" y="326" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">summaries</text><rect x="1050" y="280" width="330" height="70" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="1066" y="306" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Blocked and overdue items with named</text><text x="1066" y="326" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">owners</text></svg>