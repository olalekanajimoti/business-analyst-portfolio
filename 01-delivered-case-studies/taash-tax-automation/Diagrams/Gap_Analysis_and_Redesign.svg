s unclear</text><rect x="360" y="260" width="330" height="50" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="376" y="286" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Filing stages are disconnected</text><rect x="690" y="260" width="360" height="50" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="706" y="286" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">File, Pay, Confirm, Certificate tracker</text><rect x="1050" y="260" width="330" height="50" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="1066" y="286" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Completion rate and turnaround time</text></svg>