<svg xmlns="http://www.w3.org/2000/svg" width="1410" height="320" viewBox="0 0 1410 320"><rect width="1410" height="100%" fill="white"/><text x="30" y="46" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="26" font-weight="700" fill="#15253D">Verdaso: Gap analysis and redesign</text><text x="30" y="72" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" fill="#64748B">Each pain point traced to its root cause, the redesign response and how success is measured.</text><rect x="30" y="96" width="330" height="44" fill="#15253D" stroke="white" stroke-width="1"/><text x="46" y="124" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="white">Pain point</text><rect x="360" y="96" width="330" height="44" fill="#15253D" stroke="white" stroke-width="1"/><text x="376" y="124" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="white">Root cause</text><rect x="690" y="96" width="360" height="44" fill="#15253D" stroke="white" stroke-width="1"/><text x="706" y="124" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="white">Redesign response</text><rect x="1050" y="96" width="330" height="44" fill="#15253D" stroke="white" stroke-width="1"/><text x="1066" y="124" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="16" font-weight="700" fill="white">Evidence or measure</text><rect x="30" y="140" width="330" height="50" fill="#FFF4E8" stroke="#D5DDE8" stroke-width="1"/><text x="46" y="166" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1E293B">Weak provenance</text><rect x="360" y="140" width="330" height="50" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="376" y="166" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Files separated from source context</text><rect x="690" y="140" width="360" height="50" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="706" y="166" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Source-proof metadata on capture</text><rect x="1050" y="140" width="330" height="50" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="1066" y="166" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Share of records with complete source links</text><rect x="30" y="190" width="330" height="50" fill="#FFF4E8" stroke="#D5DDE8" stroke-width="1"/><text x="46" y="216" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1E293B">AI errors accepted as fact</text><rect x="360" y="190" width="330" height="50" fill="#F7F9FC" stroke="#D5DDE8" stroke-width="1"/><text x="376" y="216" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Extraction and approval not separated</text><rect x="690" y="190" width="360" height="50" fill="#F7F9FC" stroke="#D5DDE8" stroke-width="1"/><text x="706" y="216" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Human validation gate</text><rect x="1050" y="190" width="330" height="50" fill="#F7F9FC" stroke="#D5DDE8" stroke-width="1"/><text x="1066" y="216" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Correction and rejection rate</text><rect x="30" y="240" width="330" height="50" fill="#FFF4E8" stroke="#D5DDE8" stroke-width="1"/><text x="46" y="266" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1E293B">Framework changes break comparability</text><rect x="360" y="240" width="330" height="50" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="376" y="266" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Mappings are not versioned</text><rect x="690" y="240" width="360" height="50" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="706" y="266" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Effective-dated mapping tables</text><rect x="1050" y="240" width="330" height="50" fill="white" stroke="#D5DDE8" stroke-width="1"/><text x="1066" y="266" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="400" fill="#1E293B">Records using the current version</text></svg>