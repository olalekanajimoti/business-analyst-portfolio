<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="508" viewBox="0 0 1880 508"><rect width="100%" height="100%" fill="white"/><text x="40" y="60" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="34" font-weight="700" fill="#15253D">Komfort Place Signature: Gap analysis and redesign</text><text x="40" y="96" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" fill="#64748B">Each pain point traced to its root cause, the redesign response and how success is measured.</text><rect x="40" y="128" width="440" height="58" fill="#15253D" stroke="#D5DDE8"/><text x="60" y="165" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="700" fill="white">Pain point</text><rect x="480" y="128" width="440" height="58" fill="#15253D" stroke="#D5DDE8"/><text x="500" y="165" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="700" fill="white">Root cause</text><rect x="920" y="128" width="480" height="58" fill="#15253D" stroke="#D5DDE8"/><text x="940" y="165" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="700" fill="white">Redesign response</text><rect x="1400" y="128" width="440" height="58" fill="#15253D" stroke="#D5DDE8"/><text x="1420" y="165" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="21" font-weight="700" fill="white">Evidence or measure</text><rect x="40" y="186" width="440" height="94" fill="#FDF3E7" stroke="#D5DDE8"/><text x="60" y="220" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1E293B">Booking intent was lost</text><rect x="480" y="186" width="440" height="94" fill="#FFFFFF" stroke="#D5DDE8"/><text x="500" y="220" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="400" fill="#1E293B">No direct path from interest to a</text><text x="500" y="246" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="400" fill="#1E293B">booking conversation</text><rect x="920" y="186" width="480" height="94" fill="#FFFFFF" stroke="#D5DDE8"/><text x="940" y="220" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="400" fill="#1E293B">One-tap WhatsApp on every page,</text><text x="940" y="246" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="400" fill="#1E293B">prefilled with the service</text><rect x="1400" y="186" width="440" height="94" fill="#FFFFFF" stroke="#D5DDE8"/><text x="1420" y="220" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="400" fill="#1E293B">Booking taps per page</text><rect x="40" y="280" width="440" height="94" fill="#FDF3E7" stroke="#D5DDE8"/><text x="60" y="314" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1E293B">Out-of-hours questions went unanswered</text><rect x="480" y="280" width="440" height="94" fill="#F7F9FC" stroke="#D5DDE8"/><text x="500" y="314" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="400" fill="#1E293B">Only staff could answer, and only when</text><text x="500" y="340" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="400" fill="#1E293B">open</text><rect x="920" y="280" width="480" height="94" fill="#F7F9FC" stroke="#D5DDE8"/><text x="940" y="314" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="400" fill="#1E293B">Assistant for approved questions with</text><text x="940" y="340" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="400" fill="#1E293B">handoff</text><rect x="1400" y="280" width="440" height="94" fill="#F7F9FC" stroke="#D5DDE8"/><text x="1420" y="314" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="400" fill="#1E293B">Assistant chats that end in a booking</text><text x="1420" y="340" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="400" fill="#1E293B">tap</text><rect x="40" y="374" width="440" height="94" fill="#FDF3E7" stroke="#D5DDE8"/><text x="60" y="408" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="700" fill="#1E293B">Demand drivers were invisible</text><rect x="480" y="374" width="440" height="94" fill="#FFFFFF" stroke="#D5DDE8"/><text x="500" y="408" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="400" fill="#1E293B">No tracking on pages or buttons</text><rect x="920" y="374" width="480" height="94" fill="#FFFFFF" stroke="#D5DDE8"/><text x="940" y="408" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="400" fill="#1E293B">First-party click analytics and</text><text x="940" y="434" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="400" fill="#1E293B">consented GA4 and Meta</text><rect x="1400" y="374" width="440" height="94" fill="#FFFFFF" stroke="#D5DDE8"/><text x="1420" y="408" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" font-size="19" font-weight="400" fill="#1E293B">Top pages and hours by booking taps</text></svg>